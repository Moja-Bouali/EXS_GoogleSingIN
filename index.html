F<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil CiberMoja</title>
    
    <link rel="stylesheet" href="style.css"> 
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <meta name="google-signin-client_id" content="32278735358-u8epp3iqt0r133jokjef0r56dsjig6j7.apps.googleusercontent.com">

</head>
<body>
    
    <div id="g_id_onload"
         data-client_id="32278735358-u8epp3iqt0r133jokjef0r56dsjig6j7.apps.googleusercontent.com"
         data-callback="onSignIn">
    </div>
    
    <div class="perfil-card">
        <h1 class="glitch-text">SINTETITZADOR-X</h1>
        
        <h2 id="missatge-benvinguda" style="display:none;">Autenticació completada. Accés a la Terminal.</h2>

        <p>ID_Usuari: <span class="status">0x4a3fB9c</span></p>
        <p>Funció: **Dev Full-Stack (Neó)**</p>
        <p>Estat: <span class="status" id="estat-connexio" style="color: #ff0077;">Desconnectat [OFFLINE]</span></p>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
        
        <button id="boto-sortir" style="display:none;" onclick="signOut()">
            DESCONNECTAR // LOGOUT
        </button>
        
        <p class="footer-text">_Sistema operatiu: **CAT_OS 2077**</p>
    </div>

    <script>
        
        const estatElement = document.getElementById('estat-connexio');
        const card = document.querySelector('.perfil-card');

        // === FUNCIONS DE GOOGLE SIGN-IN (CONTROL D'ESTAT) ===
        
        function onSignIn(response) {
            var id_token = response.credential;
            console.log("ID Token: " + id_token);

            // Actualització d'estat a CONNECTAT i color
            estatElement.textContent = 'Connectat [ONLINE]';
            estatElement.style.color = '#00ffff'; 
            
            // MOSTRA: Missatge de Benvinguda i botó de Desconnexió
            document.getElementById('missatge-benvinguda').style.display = 'block';
            document.getElementById('boto-sortir').style.display = 'block'; 
            
            // AMAGA: Botó de Google Sign-In
            document.querySelector('.g_id_signin').style.display = 'none';
        }

        function signOut() {
            // Actualització d'estat a DESCONNECTAT i color
            estatElement.textContent = 'Desconnectat [OFFLINE]';
            estatElement.style.color = '#ff0077';
            
            // AMAGA: Missatge de Benvinguda i botó de Desconnexió
            document.getElementById('missatge-benvinguda').style.display = 'none';
            document.getElementById('boto-sortir').style.display = 'none'; 

            // MOSTRA: Botó de Google Sign-In
            document.querySelector('.g_id_signin').style.display = 'block';
        }
        
        // === LÒGICA D'INTERACCIÓ CYBERPUNK (Només Paral·laxi) ===
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 40;
            const y = (window.innerHeight / 2 - e.clientY) / 40;
            
            card.style.transform = `rotateX(${y}deg) rotateY(${x}deg) scale(1.05)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
        });
    </script>
</body>
</html>
